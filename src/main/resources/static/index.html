<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Laundromat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="nav">
    <span class="brand">Smart Laundromat</span>
    <div id="navLinks" class="nav-links" hidden>
        <a href="/machines.html">Machines</a>
        <a href="/my-reservations.html">My reservations</a>
        <a id="adminLink" href="/admin.html" hidden>Admin</a>
        <span id="who" class="who"></span>
        <button id="logout" class="link-btn">Sign out</button>
    </div>
</nav>

<main>
    <div id="guest">
        <h1>Welcome</h1>
        <p><a href="/login.html">Sign in</a> | <a href="/register.html">Register</a></p>
    </div>
    <div id="member" hidden>
        <h1>Welcome back</h1>
        <p id="welcome"></p>
        <p><a class="btn" href="/machines.html">Browse machines</a></p>
    </div>
</main>

<script src="/js/api.js"></script>
<script>
    (async () => {
        const user = await requireUser();
        if (!user) return;

        document.querySelector("#guest").hidden = true;
        document.querySelector("#member").hidden = false;
        document.querySelector("#navLinks").hidden = false;

        document.querySelector("#welcome").textContent =
            "Signed in as " + user.name + " (" + user.role + ")";
        document.querySelector("#who").textContent = user.name;
        if (user.role === "ADMIN") {
            document.querySelector("#adminLink").hidden = false;
        }
    })();

    document.querySelector("#logout").addEventListener("click", async () => {
        try { await api("/api/auth/logout", { method: "POST" }); }
        finally { location.href = "/login.html"; }
    });
</script>
</body>
</html>
