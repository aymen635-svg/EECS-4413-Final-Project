
spring.application.name=smart-laundromat

# PostgreSQL Database

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/laundromat
spring.datasource.username=${DB_USER:laundromat_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update

# Disable H2 Console
spring.h2.console.enabled=false

# Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# First admin account
app.admin.email=admin@laundromat.com
app.admin.password=admin12345
