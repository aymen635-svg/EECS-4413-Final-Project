spring.application.name=smart-laundromat

# H2 in-memory database (no install needed, data resets on restart)
spring.datasource.url=jdbc:h2:mem:laundromat
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# PostgreSQL (swap these in later)
#spring.datasource.url=jdbc:postgresql://localhost:5432/laundromat
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# First admin account
app.admin.email=admin@laundromat.com
app.admin.password=admin12345
